---
media_initialize_disks: false
media_lan_address: "{{ ansible_host }}"
media_bind_address: "{{ media_lan_address if media_bootstrap_completed.stat.exists else '127.0.0.1' }}"
media_root: /opt/media-stack
media_uid: 1000
media_gid: 1000
media_timezone: Asia/Kolkata
media_disks:
  - device: /dev/disk/by-id/ata-HGST_HTS721010A9E630_JR1004BNJGSTSM
    mount: /srv/media
    label: media-hdd
  - device: /dev/disk/by-id/nvme-WD_Blue_SN570_500GB_224653460811
    mount: /srv/ssd
    label: spare-ssd

# Explicit opt-in: Cloudflare routing is managed separately through cf CLI.
media_public_hostname: ""
media_jellyfin_known_proxies: []
